<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popcorn Browser Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d0b14 0%, #150f24 50%, #09060f 100%);
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(124, 58, 237, 0.4);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      margin-bottom: 30px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ec4899, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* DuckDuckGo Search Bar */
    .search-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      gap: 6px;
      margin-bottom: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      transition: border-color 0.3s ease;
    }
    
    .search-box:focus-within {
      border-color: var(--border-accent);
    }

    .search-input {
      flex-grow: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 16px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .search-btn:hover {
      background: var(--accent-hover);
    }

    /* Directory Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 1.8rem;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.75rem;
      color: #34d399;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="logo">🍿 Popcorn Browser</h1>
      <p class="subtitle">Lightweight, fast, and fully audio-enabled streaming browser</p>
    </div>

    <!-- DuckDuckGo Lite Search -->
    <form action="https://html.duckduckgo.com/html/" method="GET" target="_self">
      <div class="search-box">
        <input type="text" name="q" class="search-input" placeholder="Search the web securely..." required autocomplete="off">
        <button type="submit" class="search-btn">Search</button>
      </div>
    </form>

    <!-- Speed Dial Directory -->
    <div class="grid">
      <a href="https://www.wikipedia.org" class="card">
        <span class="card-icon">📖</span>
        <span class="card-title">Wikipedia</span>
        <span class="card-desc">Free Encyclopedia</span>
      </a>

      <a href="https://archive.org" class="card">
        <span class="card-icon">🏛️</span>
        <span class="card-title">Internet Archive</span>
        <span class="card-desc">Retro Movies & Books</span>
      </a>

      <a href="https://www.google.com" class="card">
        <span class="card-icon">🔍</span>
        <span class="card-title">Google</span>
        <span class="card-desc">Web Search</span>
      </a>

      <a href="https://archive.org/details/movies" class="card">
        <span class="card-icon">🎬</span>
        <span class="card-title">Free Movies</span>
        <span class="card-desc">Public Domain</span>
      </a>
    </div>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span>🎧 Sound Output Enabled & Autoplay Configured</span>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Intercept clicks on speed dial cards or any links
      document.addEventListener('click', function(e) {
        const a = e.target.closest('a');
        if (a && a.href) {
          const href = a.href.trim();
          if (href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) {
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          
          if (window.parent && typeof window.parent.loadPopcornBrowserUrl === 'function') {
            window.parent.loadPopcornBrowserUrl(a.href);
          } else {
            window.location.href = window.location.origin + '/proxy?url=' + encodeURIComponent(a.href);
          }
        }
      }, true);

      // Intercept form submissions
      document.addEventListener('submit', function(e) {
        const form = e.target;
        const method = (form.method || 'get').toLowerCase();
        if (method === 'get' && form.action) {
          e.preventDefault();
          e.stopPropagation();
          
          const url = new URL(form.action);
          const formData = new FormData(form);
          for (const pair of formData.entries()) {
            url.searchParams.set(pair[0], pair[1]);
          }
          
          if (window.parent && typeof window.parent.loadPopcornBrowserUrl === 'function') {
            window.parent.loadPopcornBrowserUrl(url.toString());
          } else {
            window.location.href = window.location.origin + '/proxy?url=' + encodeURIComponent(url.toString());
          }
        }
      }, true);
    });
  </script>
</body>
</html>
