<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCorner – Rooms</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body class="chat-page">

  <!-- ── Permissions Banner ─────────────────────────────────────────── -->
  <div id="permissions-banner" class="perms-banner" style="display:none">
    <div class="perms-left">
      <span class="perms-title">🔐 Allow Permissions</span>
      <span class="perms-sub">ChatCorner needs access to work properly</span>
    </div>
    <div class="perms-indicators">
      <span class="perm-item" title="Notifications">
        🔔 Notifications <span id="perm-notif" class="perm-dot perm-prompt"></span>
      </span>
      <span class="perm-item" title="Microphone">
        🎙️ Microphone <span id="perm-mic" class="perm-dot perm-prompt"></span>
      </span>
      <span class="perm-item" title="Camera">
        📷 Camera <span id="perm-cam" class="perm-dot perm-prompt"></span>
      </span>
    </div>
    <div class="perms-actions">
      <button class="btn-allow btn-primary" onclick="requestAllPermissions()">✅ Allow All</button>
      <button class="btn-allow-skip" onclick="dismissPermissions()">Skip</button>
    </div>
  </div>
  <!-- ─────────────────────────────────────────────────────────────── -->

  <header class="topbar">
    <span class="logo-small">💬 ChatCorner</span>
    <div class="topbar-center" id="current-room-name">Select a Room</div>
    <div class="topbar-right">
      <span id="user-badge" class="user-badge"></span>
      <button class="btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar left">
      <div class="sidebar-title">🏠 Rooms</div>
      <ul id="room-list" class="room-list"></ul>
      <hr/>
      <div class="sidebar-title">🎙️ Voice Rooms</div>
      <ul id="voice-room-list" class="room-list"></ul>
    </aside>
    <main class="chat-main">
      <div id="video-grid" class="video-grid hidden"></div>
      <div id="messages" class="messages"></div>
      <video id="local-video" class="local-video hidden" autoplay muted playsinline></video>
      <div id="audio-bar" class="audio-bar hidden">
        <span id="audio-status">🎙️ Voice: Off</span>
        <canvas id="voice-visualizer" class="voice-visualizer hidden" width="200" height="24" aria-label="Voice activity visualizer"></canvas>
        <button id="btn-join-voice" class="btn-audio" onclick="joinVoice()">Join Voice</button>
        <button id="btn-leave-voice" class="btn-audio red hidden" onclick="leaveVoice()">Leave Voice</button>
        <button id="btn-mute" class="btn-audio hidden" onclick="toggleMute()">🔇 Mute</button>
        <button id="btn-toggle-camera" class="btn-audio hidden" onclick="toggleCamera()">📷 Camera Off</button>
        <div id="peers-list" class="peers-list"></div>
      </div>
      <div class="input-row">
        <input id="msg-input" type="text" placeholder="Type a message… (Enter to send)" maxlength="500"
               onkeydown="if(event.key==='Enter') sendMessage()"/>
        <button class="btn-send" onclick="sendMessage()">Send</button>
      </div>
    </main>
    <aside class="sidebar right">
      <div class="sidebar-title">👥 Online Users</div>
      <ul id="user-list" class="user-list"></ul>
    </aside>
  </div>
  <div id="audio-elements"></div>
  <div id="pm-root" class="pm-root"></div>
  <div id="floating-camera-window" class="floating-camera hidden" aria-live="polite">
    <div id="floating-camera-header" class="floating-camera-header">
      <span id="floating-camera-title">📷 Camera</span>
      <button id="floating-camera-close" class="floating-camera-close" type="button">✕</button>
    </div>
    <video id="floating-camera-video" autoplay playsinline></video>
  </div>
    <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/pm.js"></script>
  <script src="js/audio.js"></script>
</body>
</html>
