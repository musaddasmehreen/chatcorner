<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCorner – Rooms</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/chat-extras.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body class="chat-page">

  <!-- ── Permissions Banner ──────────────────────────────────────────────────── -->
  <div id="permissions-banner" class="perms-banner" style="display:none">
    <div class="perms-left">
      <span class="perms-title">🔐 Allow Permissions</span>
      <span class="perms-sub">ChatCorner needs access to work properly</span>
    </div>
    <div class="perms-indicators">
      <span class="perm-item" title="Notifications">
        🔔 Notifications <span id="perm-notif" class="perm-dot perm-prompt"></span>
      </span>
      <span class="perm-item" title="Microphone">
        🎤️ Microphone <span id="perm-mic" class="perm-dot perm-prompt"></span>
      </span>
      <span class="perm-item" title="Camera">
        📷 Camera <span id="perm-cam" class="perm-dot perm-prompt"></span>
      </span>
    </div>
    <div class="perms-actions">
      <button class="btn-allow btn-primary" onclick="requestAllPermissions()">✅ Allow All</button>
      <button class="btn-allow-skip" onclick="dismissPermissions()">Skip</button>
    </div>
  </div>
  <!-- ─────────────────────────────────────────────────────────────────────── -->

  <header class="topbar">
    <span class="logo-small">💬 ChatCorner</span>
    <div class="topbar-center" id="current-room-name">Select a Room</div>
    <div class="topbar-right">
      <span id="user-badge" class="user-badge"></span>
      <button class="btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar left">
      <div class="sidebar-title">🏠 Rooms</div>
      <ul id="room-list" class="room-list"></ul>
      <hr/>
      <div class="sidebar-title">🎤️ Voice Rooms</div>
      <ul id="voice-room-list" class="room-list"></ul>
    </aside>
    <main class="chat-main">

      <!-- ── Theme Bar ─────────────────────────────────────────────── -->
      <div class="chat-theme-bar" id="chat-theme-bar">
        <span class="chat-theme-label">🎨 Theme:</span>
        <button class="theme-dot" data-theme="nebula"
          style="background:linear-gradient(135deg,#8b6ded,#38c8e8)"
          title="Nebula" onclick="setTheme('nebula')"></button>
        <button class="theme-dot" data-theme="ember"
          style="background:linear-gradient(135deg,#e8921a,#f5c842)"
          title="Ember 🔥" onclick="setTheme('ember')"></button>
        <button class="theme-dot" data-theme="arctic"
          style="background:linear-gradient(135deg,#2a7de1,#eaf2ff)"
          title="Arctic ❄️" onclick="setTheme('arctic')"></button>
        <button class="theme-dot" data-theme="matrix"
          style="background:linear-gradient(135deg,#3dd668,#7af09a)"
          title="Matrix" onclick="setTheme('matrix')"></button>
        <button class="theme-dot" data-theme="rose"
          style="background:linear-gradient(135deg,#e0628a,#f0a0c0)"
          title="Rose 🌸" onclick="setTheme('rose')"></button>
        <span class="chat-theme-name" id="chat-theme-name">Nebula</span>
      </div>
      <!-- ─────────────────────────────────────────────────────────────────── -->

      <div id="video-grid" class="video-grid hidden"></div>
      <div id="messages" class="messages"></div>
      <video id="local-video" class="local-video hidden" autoplay muted playsinline></video>
      <div id="audio-bar" class="audio-bar hidden">
        <span id="audio-status">🎤️ Voice: Off</span>
        <canvas id="voice-visualizer" class="voice-visualizer hidden" width="200" height="24" aria-label="Voice activity visualizer"></canvas>
        <button id="btn-join-voice" class="btn-audio" onclick="joinVoice()">Join Voice</button>
        <button id="btn-leave-voice" class="btn-audio red hidden" onclick="leaveVoice()">Leave Voice</button>
        <button id="btn-mute" class="btn-audio hidden" onclick="toggleMute()">🔇 Mute</button>
        <button id="btn-toggle-camera" class="btn-audio hidden" onclick="toggleCamera()">📷 Camera Off</button>
        <div id="peers-list" class="peers-list"></div>
      </div>

      <div class="input-row" style="position:relative">
        <div id="emoji-picker" class="emoji-picker hidden">
          <button class="emoji-btn" title="Grinning" onclick="insertEmoji('😀')">😀</button>
          <button class="emoji-btn" title="Big smile" onclick="insertEmoji('😃')">😃</button>
          <button class="emoji-btn" title="Beaming" onclick="insertEmoji('😄')">😄</button>
          <button class="emoji-btn" title="Wink" onclick="insertEmoji('😉')">😉</button>
          <button class="emoji-btn" title="Smiling" onclick="insertEmoji('😊')">😊</button>
          <button class="emoji-btn" title="Laughing" onclick="insertEmoji('😂')">😂</button>
          <button class="emoji-btn" title="Rolling" onclick="insertEmoji('🤣')">🤣</button>
          <button class="emoji-btn" title="Star-struck" onclick="insertEmoji('🤩')">🤩</button>
          <button class="emoji-btn" title="Heart eyes" onclick="insertEmoji('😍')">😍</button>
          <button class="emoji-btn" title="Blowing kiss" onclick="insertEmoji('😘')">😘</button>
          <button class="emoji-btn" title="Thinking" onclick="insertEmoji('🤔')">🤔</button>
          <button class="emoji-btn" title="Shush" onclick="insertEmoji('🤫')">🤫</button>
          <button class="emoji-btn" title="Sunglasses" onclick="insertEmoji('😎')">😎</button>
          <button class="emoji-btn" title="Nerd" onclick="insertEmoji('🤓')">🤓</button>
          <button class="emoji-btn" title="Smirk" onclick="insertEmoji('😏')">😏</button>
          <button class="emoji-btn" title="Upside down" onclick="insertEmoji('🙃')">🙃</button>
          <button class="emoji-btn" title="Rolling eyes" onclick="insertEmoji('🙄')">🙄</button>
          <button class="emoji-btn" title="Surprised" onclick="insertEmoji('😲')">😲</button>
          <button class="emoji-btn" title="Mind blown" onclick="insertEmoji('🤯')">🤯</button>
          <button class="emoji-btn" title="Party" onclick="insertEmoji('🥳')">🥳</button>
          <button class="emoji-btn" title="Crying" onclick="insertEmoji('😢')">😢</button>
          <button class="emoji-btn" title="Loudly crying" onclick="insertEmoji('😭')">😭</button>
          <button class="emoji-btn" title="Angry" onclick="insertEmoji('😡')">😡</button>
          <button class="emoji-btn" title="Sleepy" onclick="insertEmoji('😴')">😴</button>
          <button class="emoji-btn" title="Sick" onclick="insertEmoji('🤒')">🤒</button>
          <button class="emoji-btn" title="100" onclick="insertEmoji('💯')">💯</button>
          <button class="emoji-btn" title="Fire" onclick="insertEmoji('🔥')">🔥</button>
          <button class="emoji-btn" title="Sparkles" onclick="insertEmoji('✨')">✨</button>
          <button class="emoji-btn" title="Heart" onclick="insertEmoji('❤️')">❤️</button>
          <button class="emoji-btn" title="Orange heart" onclick="insertEmoji('🧡')">🧡</button>
          <button class="emoji-btn" title="Yellow heart" onclick="insertEmoji('💛')">💛</button>
          <button class="emoji-btn" title="Green heart" onclick="insertEmoji('💚')">💚</button>
          <button class="emoji-btn" title="Blue heart" onclick="insertEmoji('💙')">💙</button>
          <button class="emoji-btn" title="Broken heart" onclick="insertEmoji('💔')">💔</button>
          <button class="emoji-btn" title="Thumbs up" onclick="insertEmoji('👍')">👍</button>
          <button class="emoji-btn" title="Thumbs down" onclick="insertEmoji('👎')">👎</button>
          <button class="emoji-btn" title="Clapping" onclick="insertEmoji('👏')">👏</button>
          <button class="emoji-btn" title="Wave" onclick="insertEmoji('👋')">👋</button>
          <button class="emoji-btn" title="OK hand" onclick="insertEmoji('👌')">👌</button>
          <button class="emoji-btn" title="Victory" onclick="insertEmoji('✌️')">✌️</button>
          <button class="emoji-btn" title="Muscle" onclick="insertEmoji('💪')">💪</button>
          <button class="emoji-btn" title="Pray" onclick="insertEmoji('🙏')">🙏</button>
          <button class="emoji-btn" title="Eyes" onclick="insertEmoji('👀')">👀</button>
          <button class="emoji-btn" title="Raising hand" onclick="insertEmoji('🙋')">🙋</button>
          <button class="emoji-btn" title="Trophy" onclick="insertEmoji('🏆')">🏆</button>
          <button class="emoji-btn" title="Gift" onclick="insertEmoji('🎁')">🎁</button>
          <button class="emoji-btn" title="Cake" onclick="insertEmoji('🎂')">🎂</button>
          <button class="emoji-btn" title="Music note" onclick="insertEmoji('🎵')">🎵</button>
          <button class="emoji-btn" title="Pizza" onclick="insertEmoji('🍕')">🍕</button>
          <button class="emoji-btn" title="Coffee" onclick="insertEmoji('☕')">☕</button>
          <button class="emoji-btn" title="Rainbow" onclick="insertEmoji('🌈')">🌈</button>
          <button class="emoji-btn" title="Sun" onclick="insertEmoji('☀️')">☀️</button>
          <button class="emoji-btn" title="Moon" onclick="insertEmoji('🌙')">🌙</button>
          <button class="emoji-btn" title="Star" onclick="insertEmoji('⭐')">⭐</button>
          <button class="emoji-btn" title="Rocket" onclick="insertEmoji('🚀')">🚀</button>
          <button class="emoji-btn" title="Cat" onclick="insertEmoji('😺')">😺</button>
          <button class="emoji-btn" title="Dog" onclick="insertEmoji('🐶')">🐶</button>
        </div>
        <button class="btn-emoji" id="btn-emoji" onclick="toggleEmojiPicker(event)" title="Emoji">😊</button>
        <button class="btn-voice-note" id="btn-voice-note" onclick="toggleRoomVoiceNote()" title="Voice Note" style="display:none">🎙️</button><span class="voice-note-timer" id="voice-note-timer" style="display:none"></span>
        <input id="msg-input" type="text" placeholder="Type a message… (Enter to send)" maxlength="500"
               onkeydown="if(event.key==='Enter') sendMessage()"/>
        <button class="btn-send" onclick="sendMessage()">Send</button>
      </div>
    </main>
    <aside class="sidebar right">
      <div class="sidebar-title">👥 Online Users</div>
      <ul id="user-list" class="user-list"></ul>
    </aside>
  </div>
  <div id="audio-elements"></div>
  <div id="pm-root" class="pm-root"></div>
  <div id="floating-camera-window" class="floating-camera hidden" aria-live="polite">
    <div id="floating-camera-header" class="floating-camera-header">
      <span id="floating-camera-title">📷 Camera</span>
      <button id="floating-camera-close" class="floating-camera-close" type="button">✕</button>
    </div>
    <video id="floating-camera-video" autoplay playsinline></video>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/pm.js"></script>
  <script src="js/audio.js"></script>
</body>
</html>
