<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <title>ChatCorner Admin Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body class="auth-page admin-auth-page">
  <div class="auth-container admin-auth-container">
    <div class="logo-area">
      <h1 class="logo">🛡️ ChatCorner</h1>
      <p class="tagline">Admin Access Portal</p>
    </div>

    <form id="admin-login-form" class="auth-form active">
      <label class="field-label" for="admin-username">Username</label>
      <input 
        type="text" 
        id="admin-username" 
        placeholder="Enter your username" 
        autocomplete="username" 
        required 
        spellcheck="false"
      />

      <label class="field-label" for="admin-password">Password</label>
      <input 
        type="password" 
        id="admin-password" 
        placeholder="Enter your password" 
        autocomplete="current-password" 
        required 
      />

      <button class="btn-primary" id="admin-login-btn" type="submit">Login</button>
      
      <div id="admin-login-msg" class="msg"></div>
    </form>

    <p class="admin-note">
      🔒 Only users with admin privileges can access this dashboard.
    </p>

    <a class="back-link" href="chat.html" title="Return to the chat app">← Back to Chat</a>
  </div>

  <div class="bg-animation">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
