<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCorner Admin Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page admin-auth-page">
  <div class="auth-container admin-auth-container">
    <div class="logo-area">
      <h1 class="logo">🛡️ ChatCorner</h1>
      <p class="tagline">Admin Access Portal</p>
    </div>

    <form id="admin-login-form" class="auth-form active" onsubmit="event.preventDefault(); adminLogin();">
      <label class="field-label" for="admin-username">Username</label>
      <input type="text" id="admin-username" placeholder="Enter your username" autocomplete="username" required />

      <label class="field-label" for="admin-password">Password</label>
      <input type="password" id="admin-password" placeholder="Enter your password" autocomplete="current-password" required />

      <button class="btn-primary" id="admin-login-btn" type="submit">Login as Admin</button>
      <div id="admin-login-msg" class="msg"></div>
    </form>

    <p class="admin-note">Only users with <strong>is_admin = true</strong> can access the dashboard.</p>
    <a class="back-link" href="chat.html" title="Return to the chat app">← Back to Chat</a>
  </div>

  <div class="bg-animation">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const adminMsgEl = document.getElementById('admin-login-msg');

    function setAdminMsg(text, type) {
      adminMsgEl.textContent = text;
      adminMsgEl.className = 'msg ' + (type || '');
    }

    async function checkAlreadyAdmin() {
      const { data: { session } } = await sbClient.auth.getSession();
      if (!session?.user) return;
      const { data: profile } = await sbClient
        .from('profiles')
        .select('id,is_admin')
        .eq('id', session.user.id)
        .maybeSingle();

      if (profile?.is_admin) {
        window.location.href = 'admin.html';
      }
    }

    async function adminLogin() {
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('admin-login-btn');

      if (!username || !password) {
        setAdminMsg('Please fill in both username and password.', 'error');
        return;
      }

      btn.disabled = true;
      setAdminMsg('Looking up account…', '');

      // Look up email from profiles by username
      const { data: profile, error: lookupErr } = await sbClient
        .from('profiles')
        .select('id,email,is_admin')
        .eq('username', username)
        .maybeSingle();

      if (lookupErr || !profile) {
        setAdminMsg('Username not found. Please check and try again.', 'error');
        btn.disabled = false;
        return;
      }

      if (!profile.email) {
        setAdminMsg('No email on file for this account. Please contact support.', 'error');
        btn.disabled = false;
        return;
      }

      setAdminMsg('Signing in…', '');

      const { data, error } = await sbClient.auth.signInWithPassword({ email: profile.email, password });
      if (error || !data?.user) {
        setAdminMsg(error?.message || 'Login failed. Please try again.', 'error');
        btn.disabled = false;
        return;
      }

      // Re-fetch the fresh profile to confirm admin status
      const { data: freshProfile, error: profileErr } = await sbClient
        .from('profiles')
        .select('id,is_admin')
        .eq('id', data.user.id)
        .maybeSingle();

      if (profileErr || !freshProfile?.is_admin) {
        await sbClient.auth.signOut();
        setAdminMsg('Access Denied. Admins only.', 'error');
        btn.disabled = false;
        return;
      }

      window.location.href = 'admin.html';
    }

    if (new URLSearchParams(window.location.search).get('denied') === '1') {
      setAdminMsg('Access Denied. Admins only.', 'error');
    }
    if (new URLSearchParams(window.location.search).get('setup') === 'disabled') {
      setAdminMsg('Admin bootstrap is disabled. Use secure backend/database provisioning.', 'error');
    }

    checkAlreadyAdmin();
  </script>
</body>
</html>
