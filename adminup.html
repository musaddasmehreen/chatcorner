<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCorner Admin Login</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body class="admin-login-page">
  <div class="admin-login-card">
    <h1>🛡️ ChatCorner Admin</h1>
    <p>Sign in with your admin account to manage the platform.</p>
    <form id="admin-login-form" class="admin-login-form">
      <label for="admin-email">Email</label>
      <input type="email" id="admin-email" placeholder="admin@chatcorner.com" autocomplete="email" required />

      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password" required />

      <button type="submit" class="btn-primary" id="admin-login-btn">Login to Dashboard</button>
      <div id="admin-login-msg" class="status-msg" role="status" aria-live="polite"></div>
    </form>

    <a class="back-link" href="chat.html">← Back to Chat</a>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
