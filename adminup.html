<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCorner Admin Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page admin-auth-page">
  <div class="auth-container admin-auth-container">
    <div class="logo-area">
      <h1 class="logo">🛡️ ChatCorner</h1>
      <p class="tagline">Admin Access Portal</p>
    </div>

    <form id="admin-login-form" class="auth-form active" onsubmit="event.preventDefault(); adminLogin();">
      <label class="field-label" for="admin-email">Admin Email</label>
      <input type="email" id="admin-email" placeholder="name@example.com" autocomplete="email" required />

      <label class="field-label" for="admin-password">Password</label>
      <input type="password" id="admin-password" placeholder="Enter your password" autocomplete="current-password" required />

      <button class="btn-primary" id="admin-login-btn" type="submit">Login as Admin</button>
      <div id="admin-login-msg" class="msg"></div>
    </form>

    <p class="admin-note">Only users with <strong>is_admin = true</strong> can access the dashboard.</p>
    <a class="back-link" href="chat.html" title="Return to the chat app">← Back to Chat</a>
  </div>

  <div class="bg-animation">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <script src="js/config.js"></script>
  <script>
    const adminMsgEl = document.getElementById('admin-login-msg');

    function setAdminMsg(text, type) {
      adminMsgEl.textContent = text;
      adminMsgEl.className = 'msg ' + (type || '');
    }

    async function checkAlreadyAdmin() {
      const res = await apiFetch('/api/auth/session', { method: 'GET' }).catch(() => null);
      if (!res?.ok) return;
      const payload = await res.json().catch(() => null);
      if (payload?.user?.is_admin) window.location.href = 'admin.html';
    }

    async function adminLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('admin-login-btn');

      if (!email || !password) {
        setAdminMsg('Please fill in both email and password.', 'error');
        return;
      }

      btn.disabled = true;
      setAdminMsg('Signing in…', '');

      const loginRes = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      const loginPayload = await loginRes.json().catch(() => ({}));

      if (!loginRes.ok || !loginPayload?.token) {
        setAdminMsg(loginPayload?.error || 'Login failed. Please try again.', 'error');
        btn.disabled = false;
        return;
      }

      setToken(loginPayload.token);
      const sessionRes = await apiFetch('/api/auth/session', { method: 'GET' });
      const sessionPayload = await sessionRes.json().catch(() => ({}));

      if (!sessionRes.ok || !sessionPayload?.user?.is_admin) {
        await apiFetch('/api/auth/logout', { method: 'POST', body: '{}' }).catch(() => null);
        clearToken();
        setAdminMsg('Access Denied. Admins only.', 'error');
        btn.disabled = false;
        return;
      }

      window.location.href = 'admin.html';
    }

    if (new URLSearchParams(window.location.search).get('denied') === '1') {
      setAdminMsg('Access Denied. Admins only.', 'error');
    }

    checkAlreadyAdmin();
  </script>
</body>
</html>
