<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5"/>
  <title>ChatCorner — Sign In</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#8b6ded"/>
  <meta http-equiv="X-Frame-Options" content="DENY"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.ipapi.is; media-src 'self' blob: data:;"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">
  <div class="bg-animation" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="auth-container" aria-label="Authentication">
    <div class="logo-area">
      <h1 class="logo">💬 ChatCorner</h1>
      <p class="tagline">Secure nebula chat, optimized for mobile and desktop.</p>
    </div>

    <div class="tab-switcher" role="tablist" aria-label="Authentication tabs">
      <button class="tab-btn active" type="button" onclick="showTab('login')" role="tab" aria-controls="login-tab">Login</button>
      <button class="tab-btn" type="button" onclick="showTab('register')" role="tab" aria-controls="register-tab">Register</button>
      <button class="tab-btn" type="button" onclick="showTab('guest')" role="tab" aria-controls="guest-tab">Guest</button>
    </div>

    <section id="login-tab" class="auth-form active" role="tabpanel">
      <input id="login-email" type="text" inputmode="email" autocomplete="username" placeholder="Username or email" aria-label="Username or email"/>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"/>
      <input id="login-csrf" type="hidden" data-csrf-token="true"/>
      <input id="login-honeypot" type="text" autocomplete="off" tabindex="-1" aria-hidden="true" class="honeypot-input"/>
      <button class="btn-primary" type="button" onclick="loginUser()">Sign In</button>
      <div id="login-msg" class="msg" role="status" aria-live="polite"></div>
    </section>

    <section id="register-tab" class="auth-form" role="tabpanel">
      <input id="reg-username" type="text" autocomplete="username" maxlength="20" placeholder="Username (3-20 chars)" aria-label="Username"/>
      <input id="reg-email" type="email" inputmode="email" autocomplete="email" placeholder="Email address" aria-label="Email address"/>
      <input id="reg-password" type="password" autocomplete="new-password" placeholder="Password (8+ chars, upper/lower/number/symbol)" aria-label="Password"/>
      <input id="register-csrf" type="hidden" data-csrf-token="true"/>
      <input id="register-honeypot" type="text" autocomplete="off" tabindex="-1" aria-hidden="true" class="honeypot-input"/>
      <button class="btn-primary" type="button" onclick="registerUser()">Create Account</button>
      <div id="reg-msg" class="msg" role="status" aria-live="polite"></div>
    </section>

    <section id="guest-tab" class="auth-form" role="tabpanel">
      <p class="note">Guest mode is read-only limited and has slower send limits.</p>
      <input id="guest-csrf" type="hidden" data-csrf-token="true"/>
      <input id="guest-honeypot" type="text" autocomplete="off" tabindex="-1" aria-hidden="true" class="honeypot-input"/>
      <button class="btn-primary" type="button" onclick="guestLogin()">Continue as Guest</button>
      <div id="guest-msg" class="msg" role="status" aria-live="polite"></div>
    </section>
  </main>

  <div class="theme-switcher-fixed" aria-label="Theme switcher">
    <button class="theme-dot active" data-theme="nebula" style="background:linear-gradient(135deg,#8b6ded,#38c8e8)" onclick="setTheme('nebula')" title="Nebula"></button>
    <button class="theme-dot" data-theme="ember" style="background:linear-gradient(135deg,#e8921a,#f5c842)" onclick="setTheme('ember')" title="Ember"></button>
    <button class="theme-dot" data-theme="arctic" style="background:linear-gradient(135deg,#2a7de1,#eaf2ff)" onclick="setTheme('arctic')" title="Arctic"></button>
    <button class="theme-dot" data-theme="matrix" style="background:linear-gradient(135deg,#3dd668,#7af09a)" onclick="setTheme('matrix')" title="Matrix"></button>
    <button class="theme-dot" data-theme="rose" style="background:linear-gradient(135deg,#e0628a,#fbc6d3)" onclick="setTheme('rose')" title="Rose"></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/security-utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const THEMES = ['nebula','ember','arctic','matrix','rose'];
    function setTheme(name) {
      if (!THEMES.includes(name)) return;
      localStorage.setItem('cc-theme', name);
      applyTheme(name);
    }
    function applyTheme(name) {
      document.documentElement.setAttribute('data-theme', name);
      document.querySelectorAll('.theme-dot').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === name);
      });
    }
    applyTheme(localStorage.getItem('cc-theme') || 'nebula');
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
