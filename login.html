<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ChatCorner – Login &amp; Register | Real-Time Chat Rooms</title>
  <meta name="description" content="Sign in, register, or join as a guest on ChatCorner – a real-time chat platform with voice calls, private messages, and live radio." />
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ChatCorner – Real-Time Chat &amp; Rooms" />
  <meta property="og:description" content="Connect, chat, send voice notes, and make live voice calls instantly on ChatCorner." />
  <meta property="og:image" content="https://chatcorner.qzz.io/og-image.svg" />
  <meta property="og:url" content="https://chatcorner.qzz.io/login.html" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ChatCorner – Real-Time Chat &amp; Rooms" />
  <meta name="twitter:description" content="Connect, chat, send voice notes, and make live voice calls instantly on ChatCorner." />
  <meta name="twitter:image" content="https://chatcorner.qzz.io/og-image.svg" />
  <!-- Canonical URL -->
  <link rel="canonical" href="https://chatcorner.qzz.io/login.html" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#8b6ded" />
  <!-- Security hardening headers -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <link rel="preconnect" href="https://zefcqrnhaeounzdmjscc.supabase.co"/>
  <link rel="dns-prefetch" href="https://zefcqrnhaeounzdmjscc.supabase.co"/>
  <style>
    :root {
      --bg: #090b1f;
      --panel: rgba(18, 22, 53, 0.92);
      --panel-border: rgba(139, 109, 237, 0.28);
      --text: #eef2ff;
      --muted: #a7afd5;
      --accent: #8b6ded;
      --accent-2: #6d54db;
      --danger: #ff7a7a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 200, 232, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(139, 109, 237, 0.22), transparent 35%),
        linear-gradient(180deg, #090b1f 0%, #111532 100%);
    }

    .auth-shell {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      overflow: hidden;
    }

    .hero {
      padding: 28px 28px 16px;
    }

    .brand {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      color: #bba9ff;
    }

    .sub {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 20px 20px;
    }

    .tab-btn {
      border: 1px solid rgba(139, 109, 237, 0.24);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: rgba(139, 109, 237, 0.22);
      border-color: rgba(139, 109, 237, 0.58);
    }

    .panel {
      padding: 0 20px 24px;
    }

    .auth-form {
      display: none;
      gap: 12px;
    }

    .auth-form.active {
      display: grid;
    }

    label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(8, 10, 24, 0.9);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
    }

    input:focus {
      border-color: rgba(139, 109, 237, 0.62);
      box-shadow: 0 0 0 3px rgba(139, 109, 237, 0.16);
    }

    .btn-primary {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .msg {
      min-height: 20px;
      font-size: 0.86rem;
    }

    .msg.error { color: var(--danger); }
    .msg.success { color: #7ef5a3; }

    .guest-copy {
      margin: 0 0 8px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.93rem;
    }

    .help-link {
      display: inline-block;
      margin-top: 14px;
      color: #c9bbff;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="hero">
      <h1 class="brand">ChatCorner</h1>
      <p class="sub">Sign in with your username or email, create an account, or join quickly as a guest.</p>
    </section>

    <nav class="tabs" aria-label="Authentication options">
      <button class="tab-btn active" type="button" onclick="showTab('login')">Login</button>
      <button class="tab-btn" type="button" onclick="showTab('register')">Register</button>
      <button class="tab-btn" type="button" onclick="showTab('guest')">Guest</button>
    </nav>

    <section class="panel">
      <form id="login-tab" class="auth-form active" onsubmit="event.preventDefault(); loginUser();">
        <label for="login-email">Username or Email</label>
        <input id="login-email" type="text" autocomplete="username" placeholder="Enter your username or email" />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" />
        <button class="btn-primary" type="submit">Enter Chat</button>
        <div id="login-msg" class="msg" aria-live="polite"></div>
      </form>

      <form id="register-tab" class="auth-form" onsubmit="event.preventDefault(); registerUser();">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" autocomplete="username" placeholder="Choose a username" />
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="Enter your email" />
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" placeholder="Create a password" />
        <button class="btn-primary" type="submit">Create Account</button>
        <div id="reg-msg" class="msg" aria-live="polite"></div>
      </form>

      <div id="guest-tab" class="auth-form">
        <p class="guest-copy">Guest mode gets you into the chat immediately. Guest data is temporary and removed when you leave.</p>
        <button class="btn-primary" type="button" onclick="guestLogin()">Join As Guest</button>
        <div id="guest-msg" class="msg" aria-live="polite"></div>
      </div>

      <a class="help-link" href="chat.html">Open live chat directly</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/security.js?v=3.0"></script>
  <script src="js/config.js?v=1.6"></script>
  <script src="js/auth.js?v=1.7"></script>
</body>
</html>
