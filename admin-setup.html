<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCorner — Grant Admin Access</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    body.setup-page { background: var(--bg); }
    .setup-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.4rem 2.6rem;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      box-shadow: 0 0 50px var(--glow), var(--shadow);
      backdrop-filter: blur(16px);
      animation: fadeInScale 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .setup-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .setup-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      padding: 1rem;
    }
    .setup-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      color: var(--accent2);
      text-align: center;
      margin-bottom: 0.3rem;
      letter-spacing: 0.04em;
      text-shadow: 0 0 20px rgba(var(--accent2-rgb),0.4);
    }
    .setup-subtitle {
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.6rem;
      font-size: 0.85rem;
    }
    .warning-box {
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 10px;
      padding: 0.9rem;
      margin-bottom: 1.4rem;
      font-size: 0.84rem;
      color: #ddd6fe;
      line-height: 1.5;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .form-label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .form-input {
      padding: 0.8rem 1rem;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Exo 2', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .form-input::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }
    .btn-submit {
      padding: 0.9rem;
      background: var(--send-btn);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.98rem;
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
      letter-spacing: 0.02em;
      width: 100%;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(124, 58, 237, 0.45);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status-message {
      font-size: 0.84rem;
      min-height: 1.3rem;
      text-align: center;
      margin-top: 0.8rem;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .status-message.success {
      color: var(--green);
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-message.error {
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-message.info {
      color: var(--accent2);
      background: rgba(56, 200, 232, 0.08);
    }
    .back-button {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--accent2);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .back-button:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
  </style>
</head>
<body class="setup-page" data-theme="nebula">
  <div class="bg-animation">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="setup-wrapper">
    <div class="setup-container">
      <h1 class="setup-title">🔑 ChatCorner</h1>
      <p class="setup-subtitle">Admin Bootstrap Setup</p>

      <div class="warning-box">
        ⚠️ <strong>One-time setup page.</strong><br/>
        Delete or disable <code>admin-setup.html</code> after granting your first admin access.
      </div>

      <form id="setupForm">
        <div class="form-group">
          <label class="form-label" for="setupKey">Setup Key</label>
          <input
            type="password"
            id="setupKey"
            class="form-input"
            placeholder="Enter the one-time setup key"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username to Grant Admin</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="e.g. john_doe or S@lman12"
            autocomplete="off"
            required
          />
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Grant Admin Access</button>
        <div class="status-message" id="statusMsg"></div>
      </form>

      <a href="index.html" class="back-button">← Back to Chat</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const SETUP_KEY = 'CC_SETUP_2026';
    const setupForm = document.getElementById('setupForm');
    const setupKeyInput = document.getElementById('setupKey');
    const usernameInput = document.getElementById('username');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    setupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      await grantAdmin();
    });

    function setStatus(message, type = 'info') {
      statusMsg.textContent = message;
      statusMsg.className = 'status-message ' + type;
    }

    function clearStatus() {
      statusMsg.textContent = '';
      statusMsg.className = 'status-message';
    }

    async function grantAdmin() {
      const key = setupKeyInput.value.trim();
      const username = usernameInput.value.trim();

      clearStatus();

      if (!key || !username) {
        setStatus('Please fill in all fields.', 'error');
        return;
      }

      if (key !== SETUP_KEY) {
        setStatus('❌ Invalid setup key.', 'error');
        return;
      }

      submitBtn.disabled = true;
      setStatus('Looking up user…', 'info');

      try {
        const { data: profile, error: lookupErr } = await sbClient
          .from('profiles')
          .select('id, username, is_admin')
          .eq('username', username)
          .maybeSingle();

        if (lookupErr || !profile) {
          setStatus('❌ Username not found. User must log in to chat first.', 'error');
          submitBtn.disabled = false;
          return;
        }

        if (profile.is_admin) {
          setStatus('ℹ️ This user is already an admin.', 'info');
          submitBtn.disabled = false;
          return;
        }

        setStatus('Granting admin privileges…', 'info');

        const { error: updateErr } = await sbClient
          .from('profiles')
          .update({ is_admin: true })
          .eq('id', profile.id);

        if (updateErr) {
          setStatus('❌ Failed to grant admin: ' + updateErr.message, 'error');
          submitBtn.disabled = false;
          return;
        }

        setStatus('✅ Admin granted! Redirecting…', 'success');
        
        // Store success flag in sessionStorage and redirect to index for login flow
        sessionStorage.setItem('adminGranted', 'true');
        sessionStorage.setItem('adminUsername', username);
        
        // Redirect to index which will show login page
        setTimeout(() => {
          window.location.href = 'index.html?admin=login';
        }, 1500);

      } catch (error) {
        setStatus('❌ Error: ' + error.message, 'error');
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
