<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mix Ludo Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1d4ed8 0%, #020617 52%, #000 100%);
      color: #fff;
    }

    .leaderboard-app {
      min-height: 100vh;
      padding: 14px;
    }

    .leaderboard-card {
      max-width: 980px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .leaderboard-header {
      padding: 16px;
      background: linear-gradient(135deg, #111827, #020617);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .leaderboard-header h1 {
      margin: 0;
      color: #ffcc00;
      font-size: 24px;
    }

    .leaderboard-header p {
      margin: 4px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    .leaderboard-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-btn,
    .refresh-btn,
    .back-btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mode-btn {
      background: #334155;
      color: #fff;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #ffcc00, #ff7a00);
      color: #111827;
    }

    .refresh-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
    }

    .back-btn {
      background: linear-gradient(135deg, #cbd5e1, #94a3b8);
      color: #111827;
    }

    .leaderboard-body {
      padding: 14px;
    }

    .status {
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      font-size: 13px;
      text-align: center;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: rgba(2, 6, 23, 0.72);
    }

    th,
    td {
      padding: 11px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      color: #ffcc00;
      background: rgba(0, 0, 0, 0.35);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      color: #f8fafc;
    }

    tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.035);
    }

    .rank {
      font-weight: bold;
      color: #ffcc00;
    }

    .nick {
      font-weight: bold;
      color: #93c5fd;
    }

    .mode-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #fff;
      font-size: 12px;
      text-transform: capitalize;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #cbd5e1;
    }

    @media (max-width: 640px) {
      .leaderboard-app {
        padding: 6px;
      }

      .leaderboard-header {
        padding: 12px;
      }

      .leaderboard-header h1 {
        font-size: 19px;
      }

      .leaderboard-actions {
        width: 100%;
      }

      .mode-btn,
      .refresh-btn,
      .back-btn {
        flex: 1;
        padding: 8px 9px;
        font-size: 12px;
      }

      .leaderboard-body {
        padding: 8px;
      }

      th,
      td {
        padding: 9px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="leaderboard-app">
    <div class="leaderboard-card">
      <header class="leaderboard-header">
        <div>
          <h1>🏆 Mix Ludo Leaderboard</h1>
          <p>Top Ludo players of MixChatRoom</p>
        </div>

        <div class="leaderboard-actions">
          <button class="mode-btn active" data-mode="classic" type="button">Classic</button>
          <button class="mode-btn" data-mode="arrow" type="button">Arrow</button>
          <button class="mode-btn" data-mode="blitz" type="button">Blitz</button>
          <button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
          <a class="back-btn" href="/ludo/index.html">Play</a>
        </div>
      </header>

      <main class="leaderboard-body">
        <div id="status" class="status">Loading leaderboard...</div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nick</th>
                <th>Mode</th>
                <th>Games</th>
                <th>Wins</th>
                <th>Losses</th>
                <th>Team Wins</th>
                <th>Captures</th>
                <th>Tokens Home</th>
                <th>Last Win</th>
              </tr>
            </thead>
            <tbody id="leaderboardRows">
              <tr>
                <td colspan="10" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var currentMode = 'classic';
      var statusEl = document.getElementById('status');
      var rowsEl = document.getElementById('leaderboardRows');
      var refreshBtn = document.getElementById('refreshBtn');
      var modeButtons = document.querySelectorAll('.mode-btn');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(value) {
        if (!value) {
          return '-';
        }

        return escapeHtml(value);
      }

      function setActiveMode(mode) {
        currentMode = mode;

        for (var i = 0; i < modeButtons.length; i++) {
          if (modeButtons[i].getAttribute('data-mode') === mode) {
            modeButtons[i].classList.add('active');
          } else {
            modeButtons[i].classList.remove('active');
          }
        }

        loadLeaderboard();
      }

      function renderRows(rows) {
        if (!rows || !rows.length) {
          rowsEl.innerHTML = '<tr><td colspan="10" class="empty">No leaderboard records yet.</td></tr>';
          return;
        }

        var html = '';

        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];

          html += '<tr>';
          html += '<td class="rank">' + (i + 1) + '</td>';
          html += '<td class="nick">' + escapeHtml(row.nick) + '</td>';
          html += '<td><span class="mode-pill">' + escapeHtml(row.mode) + '</span></td>';
          html += '<td>' + escapeHtml(row.games_played) + '</td>';
          html += '<td>' + escapeHtml(row.wins) + '</td>';
          html += '<td>' + escapeHtml(row.losses) + '</td>';
          html += '<td>' + escapeHtml(row.team_wins) + '</td>';
          html += '<td>' + escapeHtml(row.captures) + '</td>';
          html += '<td>' + escapeHtml(row.tokens_home) + '</td>';
          html += '<td>' + formatDate(row.last_win_at) + '</td>';
          html += '</tr>';
        }

        rowsEl.innerHTML = html;
      }

      function loadLeaderboard() {
        statusEl.textContent = 'Loading ' + currentMode + ' leaderboard...';
        rowsEl.innerHTML = '<tr><td colspan="10" class="empty">Loading...</td></tr>';

        fetch('https://www.mixchatroom.com/ludo/api/leaderboard.php?mode=' + encodeURIComponent(currentMode) + '&limit=50', {
          method: 'GET',
          credentials: 'same-origin'
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            if (!data || !data.ok) {
              statusEl.textContent = 'Could not load leaderboard.';
              rowsEl.innerHTML = '<tr><td colspan="10" class="empty">Error loading leaderboard.</td></tr>';
              return;
            }

            statusEl.textContent = 'Showing top players for ' + currentMode + ' mode.';
            renderRows(data.rows || []);
          })
          .catch(function () {
            statusEl.textContent = 'Could not load leaderboard.';
            rowsEl.innerHTML = '<tr><td colspan="10" class="empty">Error loading leaderboard.</td></tr>';
          });
      }

      for (var i = 0; i < modeButtons.length; i++) {
        modeButtons[i].addEventListener('click', function () {
          var mode = this.getAttribute('data-mode') || 'classic';
          setActiveMode(mode);
        });
      }

      refreshBtn.addEventListener('click', loadLeaderboard);

      loadLeaderboard();
    })();
  </script>
</body>
</html>
